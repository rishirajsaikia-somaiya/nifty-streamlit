name: Daily Market Data Fetcher

on:
  schedule:
    - cron: '30 3-10 * * 1-5' # Runs at 17:00 IST every day automatically
  workflow_dispatch: # Gives you a manual 'Run' button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy
          
      - name: Run fetcher
        run: python fetcher.py
        
      - name: Commit and push CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nifty_data.csv
          git commit -m "Auto-update market data" || exit 0
          git push
